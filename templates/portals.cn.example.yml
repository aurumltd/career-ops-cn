# Portal Scanner Configuration — China Market Example
# Copy this file to portals.yml when targeting Mainland China roles.
#
# This template is intentionally separate from templates/portals.example.yml so
# the main upstream defaults stay intact while China-market users get a focused
# starting point.

title_filter:
  positive:
    - "AI"
    - "ML"
    - "LLM"
    - "AIGC"
    - "Agent"
    - "大模型"
    - "人工智能"
    - "算法"
    - "推荐"
    - "搜索"
    - "NLP"
    - "语音"
    - "多模态"
    - "机器学习"
    - "深度学习"
    - "产品经理"
    - "AI产品"
    - "算法工程师"
    - "机器学习工程师"
    - "数据工程师"
    - "后端开发"
    - "平台工程师"
    - "解决方案架构师"
  negative:
    - "实习"
    - "应届"
    - "校招"
    - "Junior"
    - "Intern"
    - "销售"
    - "客服"
    - "行政"
    - "财务"
  seniority_boost:
    - "高级"
    - "资深"
    - "专家"
    - "负责人"
    - "Senior"
    - "Staff"
    - "Lead"

location_filter:
  allow:
    - "北京"
    - "上海"
    - "深圳"
    - "杭州"
    - "广州"
    - "成都"
    - "Remote"
    - "远程"
    - "混合"

search_queries:
  - name: BOSS 直聘 — AI/算法
    query: 'site:zhipin.com "算法工程师" OR "AI产品经理" OR "大模型" OR "机器学习"'
    enabled: true

  - name: 拉勾 — AI/平台
    query: 'site:lagou.com "大模型" OR "LLM" OR "平台工程师" OR "Agent"'
    enabled: true

  - name: 猎聘 — 中高级 AI 岗
    query: 'site:liepin.com "资深 算法工程师" OR "AI 产品经理" OR "解决方案架构师"'
    enabled: true

  - name: 智联招聘 — AI/数据
    query: 'site:zhaopin.com "机器学习工程师" OR "数据工程师" OR "推荐算法"'
    enabled: true

  - name: 前程无忧 — 大模型/后端
    query: 'site:51job.com "大模型" OR "后端开发" OR "AI工程师"'
    enabled: true

tracked_companies:
  - name: 字节跳动
    careers_url: https://jobs.bytedance.com/experienced
    scan_method: websearch
    scan_query: 'site:jobs.bytedance.com/experienced "算法工程师" OR "大模型" OR "AI产品经理"'
    enabled: true
    market: cn
    source_type: official

